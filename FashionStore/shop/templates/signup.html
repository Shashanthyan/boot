{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modish Hero</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- CSS -->
    <link rel="stylesheet" href="{%static 'css/index5.css'%}">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font for classy serif look -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "bodoni moda";
        }   

        .hero {
            height: 100px;
            background:  url({% static 'images/video.jpg'%})center/cover no-repeat ;
            height: 700px;
            color: white;
            position: relative; 
        }

        .navbar-custom {
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
            background-color:#111111;
        }

        .logo {
            font-size: 28px;
            font-weight: 600;
        }

        .nav-center a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .icons a {
            color: white;
            margin-left: 15px;
            font-size: 14px;
            text-decoration: none;
        }

        .hero-content {
            height: 100%;
        }

        .hero h1 {
            font-size: 150px;
            font-weight:lighter;
            letter-spacing: 3px;
            padding-left:280px;
            }

        .btn {
            color: rgb(255, 255, 255);
            border: none;
            font-size: 25px;
            letter-spacing: 2px;
            padding-left: 550px;
           
        }
       
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-custom px-4">
    <div class="container-fluid">

    
        <div class="logo text-white">Naveena</div>
        <div class="mx-auto d-none d-lg-flex nav-center">
            <a href="{% url 'home' %}">HOME</a>
            <a href="{% url 'about' %}">ABOUT</a>
            <a href="{% url 'product' %}">PRODUCT</a>
        </div>

        <div class="icons">
            <a href="{% url 'login' %}">LOGIN</a>
            <a href="{% url 'signup' %}">SIGN UP</a>
            <a href="#">SEARCH</a>
            <a href="{% url 'wishlist' %}">LIKE(0)</a>
            <a href="{% url 'cart_add' %}"> CART  (0)</a>
         
        </div>
    </div>
</nav>


<!-- Hero Section -->
<section class="hero">
    <div class="container hero-content d-flex align-items-center ">
        <div class="row">
            <div class="col1">
                <h1>ACCOUNT</h1>
                <button class="btn">Home/Page/Shop</button>
            </div>
        </div>
    </div>
</section>
<br><br><br><br>


<h2>Register</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

</body>
</html>

</body>
</html>
