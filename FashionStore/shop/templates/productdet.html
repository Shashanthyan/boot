{% extends 'base.html' %}
{% load static %}
{% block content %}
<html>
    <head>
        <title>


        </title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
         <body class="bo">
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<br><br><br>
<div class="container mt-4">


    <div class="card mb-3 shadow">
        <div class="row g-0">


            <!-- Product Image -->
            <div class="col-md-4">
                <img src="{{ product.image.url }}" class="img-fluid rounded-start" alt="Product Image">
            </div>


            <!-- Product Information -->
            <div class="col-md-8">
                <div class="card-body text-center">


                    <h3 class="card-title fw-bold">{{ product.name }}</h3>
                    <p class="card-text mt-3">{{ product.description }}</p>


                    {% if product.is_sale %}
                        <!-- Sale Badge -->
                        <div class="d-flex justify-content-center small text-warning mb-2">
                            <div class="bi-star-fill"></div>
                            &nbsp;&nbsp;Sale!&nbsp;&nbsp;
                            <div class="bi-star-fill"></div>
                        </div>


                        <!-- Sale Price -->
                        <strike class="text-danger fw-bold">${{ product.price }}</strike>
                        &nbsp;
                        <span class="text-success fw-bold">${{ product.sale_price }}</span>


                    {% else %}
                        <!-- Normal Price -->
                        <span class="fw-bold fs-5">${{ product.price }}</span>
                    {% endif %}


                    <!-- Home Button -->
                  <form action="{% url 'cart_add' %}" method="POST">
    {% csrf_token %}

    <input type="hidden" name="product_id" value="{{ product.id }}">
    <input type="hidden" name="product_qty" value="1">

    <button type="submit" class="btn btn-secondary">
        Add to Cart
    </button>
</form>


                </div>
            </div>

        </div>
    </div>
</div>
     </body>
</html>
<script>

$(document).on('click', '#add-cart', function(e) {

    e.preventDefault();

    $.ajax({

        type: 'POST',

        url: "{% url 'cart_add' %}",

        data: {
            product_id: $('#add-cart').val(),
            product_qty: 1,
            csrfmiddlewaretoken: '{{ csrf_token }}',
            action: 'post'
        },

        success: function(json) {

            document.getElementById("cart_quantity").textContent = json.qty;

            // Redirect to cart page
            window.location.href = "{% url 'cart_summary' %}";
        },

        error: function(xhr, errmsg, err) {

            console.log("Error:", errmsg);
            console.log("Response:", xhr.responseText);

        }

    });

});

</script>




{% endblock %}
